<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCSHonor | 计试一站式学术资源共享</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Fira+Code:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a0e27;
      --bg-secondary: #0f1535;
      --text-primary: #ffffff;
      --text-secondary: #a0aec0;
      --accent-cyan: #00d9ff;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1535 100%);
      color: var(--text-primary);
      font-family: "JetBrains Mono", "Fira Code", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* 动态背景粒子效果 */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 217, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
      animation: pulse 15s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    /* 网格背景 */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(0, 217, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    .container {
      width: 100%;
      max-width: 1200px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* Logo 区域 - 视差效果 */
    .brand-area {
      margin-bottom: 3rem;
      position: relative;
      display: inline-block;
      animation: fadeInDown 1s ease-out;
      transition: transform 0.1s ease-out;
    }

    .brand-logo {
      width: 100%;
      max-width: 650px;
      height: auto;
      filter: drop-shadow(0 0 40px rgba(0, 217, 255, 0.4)) contrast(1.2) brightness(1.1);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .brand-logo:hover {
      filter: drop-shadow(0 0 60px rgba(139, 92, 246, 0.6)) contrast(1.3) brightness(1.2);
      transform: translateY(-5px) scale(1.02);
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 标题区域 - 视差效果 */
    .hero-text {
      margin-bottom: 4rem;
      position: relative;
      animation: fadeInUp 1s ease-out 0.2s backwards;
      transition: transform 0.1s ease-out;
    }

    .hero-text::after {
      content: "";
      display: block;
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
      margin: 2rem auto 0;
      border-radius: 2px;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.6);
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(0, 217, 255, 0.6);
        transform: scaleX(1);
      }
      50% {
        box-shadow: 0 0 30px rgba(139, 92, 246, 0.8);
        transform: scaleX(1.1);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .subtitle {
      font-family: "Fira Code", "JetBrains Mono", monospace;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 50%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.4;
      letter-spacing: -0.01em;
      margin-bottom: 1rem;
      text-shadow: 0 0 30px rgba(0, 217, 255, 0.3);
    }

    .description {
      font-family: "Source Code Pro", monospace;
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* Logo 网格 - 完全显示 + 视差滚动 */
    .partners-section {
      margin-bottom: 4rem;
      animation: fadeInUp 1s ease-out 0.4s backwards;
      transition: transform 0.1s ease-out;
    }

    .partners-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      color: var(--accent-cyan);
      margin-bottom: 2rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 600;
      text-shadow: 0 0 15px rgba(0, 217, 255, 0.6);
    }

    .partners-label::before {
      content: "< ";
      color: var(--accent-pink);
    }

    .partners-label::after {
      content: " />";
      color: var(--accent-purple);
    }

    .logo-grid {
      display: flex;
      gap: 2rem;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      position: relative;
      width: 100%;
      padding: 20px 0;
    }

    .logo-grid::before,
    .logo-grid::after {
      content: "";
      position: absolute;
      top: 0;
      width: 100px;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .logo-grid::before {
      left: 0;
      background: linear-gradient(90deg, #0a0e27 0%, transparent 100%);
    }

    .logo-grid::after {
      right: 0;
      background: linear-gradient(270deg, #0a0e27 0%, transparent 100%);
    }

    .logo-scroll-track {
      display: flex;
      gap: 2rem;
      align-items: center;
      animation: scroll 20s linear infinite;
      will-change: transform;
    }

    @keyframes scroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(calc(-33.333%));
      }
    }

    .logo-scroll-track:hover {
      animation-play-state: paused;
    }

    .logo-card {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      min-width: 140px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      border-radius: 12px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 217, 255, 0.2), transparent);
      transition: left 0.6s ease;
    }

    .logo-card:hover::before {
      left: 100%;
    }

    .logo-card:hover {
      border-color: rgba(0, 217, 255, 0.6);
      transform: translateY(-10px) scale(1.05);
      box-shadow:
        0 15px 50px rgba(0, 217, 255, 0.4),
        0 0 0 1px rgba(0, 217, 255, 0.3) inset;
    }

    /* Logo 完全显示 - 彩色且清晰 */
    .logo-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: brightness(1.1) saturate(1.2) contrast(1.1);
      transition: all 0.4s ease;
      position: relative;
      z-index: 1;
    }

    .logo-card:hover img {
      filter: brightness(1.3) saturate(1.4) contrast(1.2) drop-shadow(0 0 20px rgba(0, 217, 255, 0.5));
      transform: scale(1.1);
    }

    /* 按钮 - 代码风格 */
    .action-area {
      margin-top: 2rem;
      animation: fadeInUp 1s ease-out 0.6s backwards;
      transition: transform 0.1s ease-out;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 60px;
      font-size: 1.2rem;
      font-family: "JetBrains Mono", monospace;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: 2px solid rgba(0, 217, 255, 0.5);
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.15em;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 10px 40px rgba(0, 217, 255, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
    }

    .enter-btn::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .enter-btn:hover::before {
      width: 400px;
      height: 400px;
    }

    .enter-btn:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: rgba(139, 92, 246, 0.8);
      box-shadow:
        0 20px 60px rgba(139, 92, 246, 0.6),
        0 0 0 2px rgba(255, 255, 255, 0.2) inset;
    }

    .enter-btn:active {
      transform: translateY(-2px) scale(1.02);
    }

    .enter-btn span {
      position: relative;
      z-index: 1;
    }

    .enter-btn .arrow {
      font-size: 1.3rem;
      transition: transform 0.3s ease;
    }

    .enter-btn:hover .arrow {
      transform: translateX(5px);
    }

    /* 页脚 - 代码风格 */
    footer {
      margin-top: 5rem;
      padding-top: 2rem;
      width: 100%;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-family: "Source Code Pro", monospace;
      border-top: 1px solid rgba(0, 217, 255, 0.1);
      animation: fadeIn 1s ease-out 0.8s backwards;
      letter-spacing: 0.05em;
    }

    footer::before {
      content: "// ";
      color: var(--accent-green);
      margin-right: 0.3em;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .subtitle {
        font-size: 1.6rem;
      }
      .enter-btn {
        padding: 16px 48px;
        font-size: 1rem;
      }
      .brand-logo {
        max-width: 500px;
      }
      .logo-card {
        min-width: 120px;
        height: 80px;
      }
      .logo-scroll-track {
        gap: 1.5rem;
      }
      .logo-grid {
        gap: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .logo-card {
        min-width: 100px;
        height: 70px;
        padding: 12px;
      }
      .logo-scroll-track {
        gap: 1rem;
      }
      .logo-grid {
        gap: 1rem;
      }
      .logo-grid::before,
      .logo-grid::after {
        width: 50px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="brand-area">
      <img src="assets/mylogo.png" alt="OpenCSHonor Logo" class="brand-logo" onerror="this.style.display='none'; document.getElementById('backup-title').style.display='block';">
      <h1 id="backup-title" style="display:none; font-family:'Fira Code',monospace; font-size:2.5rem; background:linear-gradient(135deg, #ffffff, #00d9ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">OpenCSHonor</h1>
    </header>

    <div class="hero-text">
      <h2 class="subtitle">计试一站式学术资源共享项目</h2>
      <p class="description">由计学组开发并长期维护</p>
    </div>

    <div class="partners-section">
      <div class="partners-label">Supported By</div>
      <div class="logo-grid" id="logo-grid">
        <div class="logo-scroll-track" id="logo-scroll-track">
        </div>
      </div>
    </div>

    <div class="action-area">
      <a href="site/index.html" class="enter-btn" id="enter-btn">
        <span>ENTER</span>
        <span class="arrow">&rarr;</span>
      </a>
    </div>

    <footer>
      &copy; OpenCSHonor Project. All Rights Reserved.
    </footer>
  </div>

  <script>
    // 配置区域
    const LOGO_COUNT = 6;
    const TARGET_PAGE = "site/index.html";

    // 渲染无限滚动的 logo 网格
    function renderGrid() {
      const scrollTrack = document.getElementById('logo-scroll-track');

      // 创建三组相同的 logo 实现无限滚动，显示更多 logo
      for (let round = 0; round < 3; round++) {
        for (let i = 1; i <= LOGO_COUNT; i++) {
          const card = document.createElement('div');
          card.className = 'logo-card';

          const img = document.createElement('img');
          img.src = `assets/${i}.png`;
          img.alt = `Partner Logo ${i}`;

          img.onerror = () => {
            card.remove();
          };

          card.appendChild(img);
          scrollTrack.appendChild(card);
        }
      }
    }

    // 初始化
    renderGrid();

    // 按钮跳转
    document.getElementById("enter-btn").addEventListener("click", (e) => {
      e.preventDefault();
      window.location.href = TARGET_PAGE;
    });

    // 添加淡入动画到 logo 卡片
    const style = document.createElement('style');
    style.textContent = `
      .logo-card {
        animation: fadeInScale 0.6s ease-out backwards;
      }
      @keyframes fadeInScale {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    `;
    document.head.appendChild(style);

    // 鼠标视差滚动效果
    let mouseX = 0;
    let mouseY = 0;
    let currentX = 0;
    let currentY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) / 50;
      mouseY = (e.clientY - window.innerHeight / 2) / 50;
    });

    function updateParallax() {
      currentX += (mouseX - currentX) * 0.05;
      currentY += (mouseY - currentY) * 0.05;

      // Logo 视差
      const brandArea = document.querySelector('.brand-area');
      if (brandArea) {
        brandArea.style.transform = `translate(${currentX * 0.5}px, ${currentY * 0.5}px)`;
      }

      // 标题视差
      const heroText = document.querySelector('.hero-text');
      if (heroText) {
        heroText.style.transform = `translate(${currentX * 0.3}px, ${currentY * 0.3}px)`;
      }

      // 按钮视差
      const actionArea = document.querySelector('.action-area');
      if (actionArea) {
        actionArea.style.transform = `translate(${currentX * 0.15}px, ${currentY * 0.15}px)`;
      }

      requestAnimationFrame(updateParallax);
    }

    updateParallax();

    // 页面滚动视差效果（如果页面可以滚动）
    let scrollY = 0;

    window.addEventListener('scroll', () => {
      scrollY = window.scrollY;

      const brandArea = document.querySelector('.brand-area');
      if (brandArea) {
        brandArea.style.transform = `translate(${currentX * 0.5}px, ${currentY * 0.5 - scrollY * 0.3}px)`;
      }

      const heroText = document.querySelector('.hero-text');
      if (heroText) {
        heroText.style.transform = `translate(${currentX * 0.3}px, ${currentY * 0.3 - scrollY * 0.2}px)`;
      }
    });
  </script>

</body>
</html>
